# Blueprint Render : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gestion-locative-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile -
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-locative-db
          property: connectionString
      # A renseigner dans le tableau de bord Render
      - key: CORS_ALLOWED_ORIGINS        # ex. https://mon-frontend.vercel.app
        sync: false
      - key: ALLOWED_HOSTS               # domaine personnalisé éventuel (le domaine Render est ajouté seul)
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD   # 12 caractères minimum
        sync: false
      # Plus tard, pour activer Celery : créer un Key Value Render et lier REDIS_URL
      # - key: REDIS_URL
      #   fromService:
      #     type: keyvalue
      #     name: gestion-locative-redis
      #     property: connectionString

databases:
  - name: gestion-locative-db
    plan: free
    region: frankfurt
    databaseName: gestion_locative
    user: gestion_locative
